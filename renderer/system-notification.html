<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font-family:Segoe UI,Arial,sans-serif;color:var(--text);overflow:hidden}
#notice{--accent:#474ed8;--accent-hi:#6a70e6;--panel:rgba(22,25,55,.96);--border-hi:rgba(255,255,255,.14);--text:#eef1ff;--bad:#d95757;--warn:#d99b3d;min-width:240px;max-width:340px;margin:8px 12px 8px 8px;background:var(--panel);border:1px solid var(--border-hi);border-left:3px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:12px;color:var(--text);box-shadow:0 14px 34px -10px rgba(0,0,0,.5);opacity:0;transform:translateX(20px);transition:opacity .2s ease,transform .2s ease}
#notice.show{opacity:1;transform:translateX(0)}
#notice.hide{opacity:0;transform:translateX(20px);transition:opacity .2s ease,transform .2s ease}
#notice.success{border-left-color:var(--accent-hi)}
#notice.error{border-left-color:var(--bad)}
#notice.warn{border-left-color:var(--warn)}
#title{font-weight:600;margin-bottom:2px}
#title.success{color:var(--accent-hi)}
#title.error{color:var(--bad)}
#title.warn{color:var(--warn)}
#body{line-height:1.4;white-space:normal;overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){#notice{transition:none}}
</style>
</head>
<body>
<div id="notice"><div id="title"></div><div id="body"></div></div>
<script src="notification-shared.js"></script>
<script>
window.pfcNotification?.onShow((data)=>window.PFCSharedNotification?.apply(data));
</script>
</body>
</html>
