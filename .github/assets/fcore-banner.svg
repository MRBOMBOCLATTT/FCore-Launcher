<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">FCore Launcher</title>
  <desc id="desc">Minecraft launcher for managing instances, mods and game content</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#5D65E8" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6972F2"/>
      <stop offset="1" stop-color="#474ED8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="#0F1137"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>
  <path d="M0 264H1280" stroke="#474ED8" stroke-opacity=".45"/>
  <g transform="translate(92 92)">
    <rect width="136" height="136" rx="28" fill="#1C1F56" stroke="#6972F2" stroke-opacity=".7" stroke-width="2"/>
    <path d="M34 42h68v16H50v18h42v16H50v28H34z" fill="url(#accent)"/>
    <rect x="78" y="94" width="24" height="24" rx="4" fill="#AAB0FF"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#F5F6FF">
    <text x="274" y="151" font-size="62" font-weight="700" letter-spacing="-2">FCore Launcher</text>
    <text x="278" y="198" font-size="23" font-weight="400" fill="#B7BCEB">Minecraft instances · Mod management · Built-in diagnostics</text>
    <text x="278" y="248" font-size="15" font-weight="600" letter-spacing="2.5" fill="#929AF4">PRESS F. MANAGE YOUR MINECRAFT.</text>
  </g>
  <g transform="translate(1040 86)" opacity=".9">
    <rect width="52" height="52" rx="9" fill="#474ED8"/>
    <rect x="64" y="0" width="52" height="52" rx="9" fill="#1C1F56" stroke="#6972F2" stroke-opacity=".7"/>
    <rect x="0" y="64" width="52" height="52" rx="9" fill="#1C1F56" stroke="#6972F2" stroke-opacity=".7"/>
    <rect x="64" y="64" width="52" height="52" rx="9" fill="#6972F2" opacity=".65"/>
  </g>
</svg>
